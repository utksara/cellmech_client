<!DOCTYPE html>
<html lang="en-US">

<head>
  <title>Beehive</title>
  <style>
    #container {
      background-color: #E7E9EB;
      width: 100%;
      overflow: auto;
      position: absolute;
      top: 50px;
      bottom: 0;
      height: auto;
    }

    #textareacontainer {
      height: 10%;
      width: 100%;
    }

    #textarea {
      padding-left: 10px;
      padding-right: 5px;
    }

    #textareawrapper {
      width: 100%;
      height: 100%;
      position: relative;
    }

    #svgContainer {
      background-color: #868687;
    }

    #textAreaCode {
      background-color: #303030;
      font-family: consolas, Menlo, "courier new", monospace;
      font-size: 15px;
      color: #fac8a5;
      height: 100%;
      width: 100%;
      padding: 8px;
      resize: none;
      border: none;
      line-height: normal;
    }

    #textarea.horizontal {
      height: 100%;
      padding-left: 10px;
      padding-right: 10px;
    }

    #run_button {
      background-color: #00a589;
      color: white;
      text-align: center;
      font-family: 'Source Sans Pro', sans-serif;
      font-size: 18px;
      padding: 6px 25px;
      border: none;
      word-spacing: 10px;
    }

    #documentation_button {
      background-color: #00a589;
      color: white;
      font-family: 'Source Sans Pro', sans-serif;
      font-size: 18px;
      padding: 6px 25px;
      border: none;
      word-spacing: 10px;
    }

    #about_button {
      background-color: #00a589;
      color: white;
      font-family: 'Source Sans Pro', sans-serif;
      font-size: 18px;
      padding: 6px 25px;
      border: none;
      word-spacing: 10px;
    }

    /* #about_button:hover,
    #run_button:hover {
      background-color: #059862 !important;
      color: white !important;
    } */
  </style>
</head>

<body>
  <div id='header_options'>
    <div id="shield"></div>
    <div class="top_panel">
      <img src="images/beehive_logo.svg" alt="heehive_logo" width="100" height="auto" hspace="10px">
        <button id="documentation_button" class="right-button w3-hover-text-green" style="float: right;"
          onclick="window.location.href = 'https://github.com/utksara/cellmech_server/blob/main/README.md';">Documentation</button>
        <button id="about_button" style="float: right;"
          onclick="window.location.href = 'http://ec2-18-234-227-168.compute-1.amazonaws.com:3000/';">About</button>
        <button id="run_button" style="float: centre;"
              onclick="run_simulation();">Run</button>
    </div>
    <a href="javascript:void(0)" id="dragbar"></a>
    <div id="container">
      <div id="textareacontainer">
        <div id="textarea">
          <div id="textareawrapper">
            <textarea autocomplete="off" id="textAreaCode" wrap="logical" spellcheck="false"></textarea>
          </div>
        </div>
      </div>
      <div id="viewAreaWrapper">
        <link rel="stylesheet" href="stylesheets/error_message.css">
        <div id="myModal" class="modal">
          <div class="modal-content">
            <span class="close">&times;</span>
            <div id="error_message" class="error_message">Loading...</div>
          </div>
        </div>
        <div id="svgContainer">
        <svg id="canvas" height="500" width="500"></svg>
        <script type="module" src="javascripts/customsim.js"></script>
        </div>
        <form id="codeForm" autocomplete="off" style="margin:0px;display:none;">
          <input type="hidden" name="code" id="code" />
        </form>
      </div>
    </div>
  </div>
  
  <script type="module" src="javascripts/run_button.js"></script>
</body>

</html>
