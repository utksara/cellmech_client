<!DOCTYPE html>
<html lang="en-US">

<head>
  <script src="https://cdn.tailwindcss.com"></script>

  <title>Beehive</title>
  <style>
    #beehive_logo{
      width : 20%;
      height : auto;
      display: inline-block;
    }

    #svgContainer {
      background-color: #868687;
    }

    #textarea.horizontal {
      height: 100%;
      padding-left: 10px;
      padding-right: 10px;
    }

    #run_button, #documentation_button, #about_button {
      background-color: #00a589;
      color: white;
      font-family: 'Source Sans Pro', sans-serif;
      font-size: 18px;
      padding: 6px 25px;
      border: none;
      word-spacing: 10px;
      float: right;
    }
  </style>
</head>

<body class="p-4 sm:p-6 md:p-8">
  <div class="logo-panel p-8 rounded-lg shadow-md flex items-center justify-center text-white">
    <img src="images/beehive_logo.svg" alt="beehive logo" class="h-16 w-32 rounded-md object-contain">
  </div>
  <button id="documentation_button" onclick="window.location.href = 'https://github.com/utksara/cellmech_server/blob/main/README.md';">Documentation</button>
  <button id="about_button" onclick="window.location.href = 'http://ec2-18-234-227-168.compute-1.amazonaws.com:3000/';">About</button>

  <div id="viewAreaWrapper">
    <link rel="stylesheet" href="stylesheets/error_message.css">
    <div id="myModal" class="modal">
      <div class="modal-content">
        <span class="close">&times;</span>
        <div id="error_message" class="error_message">Loading...</div>
      </div>
    </div>
    <div id="svgContainer" class="rounded-lg">
      <svg id="canvas" height="500" width="500"></svg>
      <script type="module" src="javascripts/customsim.js"></script>
    </div>
    <form id="codeForm" autocomplete="off" style="margin:0px;display:none;">
      <input type="hidden" name="code" id="code" />
    </form>
  </div>

  <div class="text-panel bg-gray-800 p-5 rounded-lg shadow-sm border border-gray-700 flex items-center justify-between gap-4">
    <p id="textAreaCode" contenteditable="true" class="text-gray-200 text-base sm:text-lg font-medium leading-relaxed outline-none focus:ring-2 focus:ring-blue-500 focus:rounded-md p-1 -m-1 cursor-text"></p>
    <button id="run_button" class="flex items-center px-3 py-1 bg-gray-700 text-gray-200 text-xs font-semibold rounded-full shadow-sm border border-gray-600 hover:bg-gray-600 hover:border-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-75 transition duration-300 ease-in-out flex-shrink-0">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-4 h-4 mr-1">
        <path fill-rule="evenodd" d="M4.5 5.653c0-1.427 1.529-2.38 2.872-1.624L19.294 12l-11.922 7.971c-1.344.756-2.872-.196-2.872-1.624V5.653Z" clip-rule="evenodd" />
      </svg>
      Run
    </button>
  </div>

  <script type="module" src="javascripts/run_button.js"></script>
</body>

</html>
