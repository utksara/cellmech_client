<!DOCTYPE html>
<html lang="en-US">

<head>
  <script src="https://cdn.tailwindcss.com"></script>

  <title>Beehive</title>
  <style>
    #visContainer {
      background-color: #d1d1d1;
      min-height: 60vh;
    }

    #documentation_button,
    #about_button {
      background-color: #00a589;
      color: white;
      font-family: 'Source Sans Pro', sans-serif;
      font-size: 18px;
      padding: 6px 25px;
      border: none;
      word-spacing: 10px;
      float: right;
    }
  </style>
</head>

<!-- <body class="bg-gradient-to-br from-blue-100 to-indigo-200 flex items-center justify-center min-h-screen p-4"> -->

<body class="p-4 sm:p-6 md:p-8">
  <div class="logo-panel p-8 rounded-lg shadow-md flex items-center justify-center text-white">
    <img src="images/beehive_logo.svg" alt="beehive logo" class="h-16 w-32 rounded-md object-contain">
  </div>
  <div class="flex items-center text-white">
    <button id="documentation_button"
      onclick="window.location.href = 'https://github.com/utksara/cellmech_server/blob/main/README.md';">Documentation</button>
    <button id="about_button"
      onclick="window.location.href = 'http://ec2-18-234-227-168.compute-1.amazonaws.com:3000/';">About</button>
  </div>

  <div id="viewAreaWrapper">
    <link rel="stylesheet" href="stylesheets/error_message.css">
    <div id="myModal" class="modal">
      <div class="modal-content">
        <span class="close">&times;</span>
        <div id="error_message" class="error_message">Loading...</div>
      </div>
    </div>
    <div id="visContainer"
      class="bg-gradient-to-br from-blue-100 to-indigo-200 flex items-center justify-center rounded-lg">
      <div class="svg-container rounded-xl shadow-lg p-8 max-w-full w-full flex flex-col items-center justify-center">
        <svg id="svgContainer" viewBox="0 0 200 200" class="w-4/5 h-auto max-w-xs md:max-w-sm lg:max-w-md">
        </svg>
      </div>
      <script type="module" src="javascripts/customsim.js"></script>
    </div>

      class="text-panel bg-gray-800 p-5 rounded-lg shadow-sm border border-gray-700 flex items-center justify-between gap-4">
      <p id="textAreaCode" contenteditable="true"
        class="text-gray-200 text-base sm:text-lg font-medium leading-relaxed outline-none focus:ring-2 focus:ring-blue-500 focus:rounded-md p-1 -m-1 cursor-text">
      </p>
      <button id="run_button"
        class="flex items-center px-3 py-1 bg-gray-700 text-gray-200 text-xs font-semibold rounded-full shadow-sm border border-gray-600 hover:bg-gray-600 hover:border-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-75 transition duration-300 ease-in-out flex-shrink-0">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-4 h-4 mr-1">
          <path fill-rule="evenodd"
            d="M4.5 5.653c0-1.427 1.529-2.38 2.872-1.624L19.294 12l-11.922 7.971c-1.344.756-2.872-.196-2.872-1.624V5.653Z"

        </svg>
        Run
      </button>

    <div class="bg-white p-6 rounded-lg shadow-xl  border border-gray-200">
        <!-- <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">Enter your prompt below:</h1> -->
        <div class="mb-4">
            <textarea
                id="promptInput"
                rows="8"
                class="shadow-sm appearance-none border border-gray-300 rounded-lg w-full py-3 px-4 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-200 ease-in-out resize-y"
                placeholder="Type your query, just like you would to a GPT prompt..."
            ></textarea>
        </div>

        <div class="flex justify-end">
            <button id="run_button"
                type="submit"
                class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-6 rounded-lg shadow-md hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition duration-200 ease-in-out"
            >
                Run
            </button>
        </div>
    </div>

    <script type="module" src="javascripts/run_button.js"></script>
</body>

</html>
